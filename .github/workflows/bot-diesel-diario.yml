name: Bot Diesel · Relatorio Diario (Telegram)

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 BRT (UTC-3) todos os dias
  workflow_dispatch:

concurrency:
  group: bot-diesel-diario
  cancel-in-progress: false

jobs:
  enviar-diario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install matplotlib numpy requests

      - name: Gerar e enviar relatorio diario
        working-directory: flash-report-diesel
        env:
          SUPABASE_TRANSNET_URL: ${{ secrets.SUPABASE_TRANSNET_URL }}
          SUPABASE_TRANSNET_KEY: ${{ secrets.SUPABASE_TRANSNET_KEY }}
          SUPABASE_BCNT_URL: ${{ secrets.SUPABASE_BCNT_URL }}
          SUPABASE_BCNT_KEY: ${{ secrets.SUPABASE_BCNT_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python gen_diario.py

      - name: Sobe artefato (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diesel-diario
          path: flash-report-diesel/diario_*.png
          if-no-files-found: ignore
          retention-days: 7
