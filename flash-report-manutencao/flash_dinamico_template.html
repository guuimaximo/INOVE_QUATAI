<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Manutenção Interativo</title>
<style>
:root{
  --bg:#f3f7f6; --card:#ffffff; --ink:#123b35; --ink2:#5b716c; --muted:#8a9e9a;
  --line:#d6e3e0; --soft:#eef4f3; --teal:#0d9488; --teal-d:#0f3d38; --teal-l:#ccfbf1;
  --head:#0f3d38; --head-ink:#e6fffa; --good:#15803d; --bad:#b91c1c; --warn:#b45309;
  --bar:#0d9488; --bar2:#a7d8d2; --line2:#b45309; --shadow:0 1px 2px rgba(15,61,56,.06),0 2px 8px rgba(15,61,56,.05);
  --nav:#0b2f2b; --nav-ink:#b7d9d3; --nav-on:#134e48;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1614; --card:#10201d; --ink:#e2efec; --ink2:#9fb8b3; --muted:#6b8580;
  --line:#23403b; --soft:#152a26; --teal:#2dd4bf; --teal-d:#5eead4; --teal-l:#134e48;
  --head:#08201d; --head-ink:#ccfbf1; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --bar:#2dd4bf; --bar2:#1f5f58; --line2:#fbbf24; --shadow:none; --nav:#061513; --nav-ink:#8fb3ad; --nav-on:#134e48;}}
:root[data-theme="dark"]{
  --bg:#0a1614; --card:#10201d; --ink:#e2efec; --ink2:#9fb8b3; --muted:#6b8580;
  --line:#23403b; --soft:#152a26; --teal:#2dd4bf; --teal-d:#5eead4; --teal-l:#134e48;
  --head:#08201d; --head-ink:#ccfbf1; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --bar:#2dd4bf; --bar2:#1f5f58; --line2:#fbbf24; --shadow:none; --nav:#061513; --nav-ink:#8fb3ad; --nav-on:#134e48;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
nav.side{background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 10px 30px}
nav.side .brand{color:#e6fffa;padding:4px 10px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
nav.side .brand .t1{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
nav.side .brand .t2{font-size:16px;font-weight:700;margin-top:2px}
nav.side button{display:flex;gap:9px;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--nav-ink);font-size:13px;align-items:baseline}
nav.side button:hover{background:rgba(255,255,255,.06);color:#fff}
nav.side button.on{background:var(--nav-on);color:#fff;font-weight:600}
nav.side button .n{font-size:11px;opacity:.6;min-width:18px;font-variant-numeric:tabular-nums}
.content{min-width:0}
header.top{background:var(--head);color:var(--head-ink);padding:16px 26px 12px}
header.top .t1{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
header.top h1{margin:2px 0 0;font-size:23px;font-weight:700}
header.top .sub{font-size:12.5px;opacity:.75;margin-top:3px}
.filters{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:9px 26px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;box-shadow:var(--shadow)}
.fgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin-right:2px}
select,input[type=search]{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink);font:inherit}
input[type=search]{width:180px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--teal)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .chip.on{color:#04201c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#04201c}}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--teal);width:16px;height:16px}
main{max-width:1280px;padding:18px 26px 70px}
.ptitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.ptitle h2{margin:0;font-size:21px;letter-spacing:.02em;text-transform:uppercase;color:var(--teal-d)}
.ptitle .ps{font-size:12.5px;color:var(--ink2)}
.ptitle .mes{background:var(--head);color:var(--head-ink);border-radius:8px;padding:6px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.accent{height:3px;background:linear-gradient(90deg,var(--teal),transparent);border-radius:2px;margin:-6px 0 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.mt{margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card>h3{margin:0;padding:12px 16px 0;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-d);font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card>h3 small{text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400;font-size:12px}
.card .body{padding:10px 16px 14px}
.kpi{padding:12px 14px;text-align:left;border:1px solid var(--line);display:block;width:100%}
button.kpi{cursor:pointer;transition:border-color .15s,transform .15s}
button.kpi:hover{border-color:var(--teal);transform:translateY(-1px)}
.kpi .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.kpi .vl{font-size:25px;font-weight:700;margin-top:2px;line-height:1.15}
.kpi .dt{font-size:12px;color:var(--ink2);margin-top:3px}
.kpi.big .vl{font-size:36px}
.up{color:var(--good)} .down{color:var(--bad)} .neutral{color:var(--ink2)} .warn{color:var(--warn)}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px}
.cons{border-left:4px solid var(--teal);background:var(--card);border-radius:0 12px 12px 0;padding:12px 16px;margin-top:14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cons b.t{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-d);margin-bottom:4px}
.cons p{margin:0;line-height:1.55}
.note{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.status{display:inline-block;padding:3px 10px;border-radius:6px;font-weight:700;font-size:12px;letter-spacing:.06em}
.status.bad{background:#fee2e2;color:#991b1b}.status.ok{background:#dcfce7;color:#166534}.status.al{background:#fef3c7;color:#92400e}
.hb{display:flex;flex-direction:column;gap:2px}
.hb-row{display:grid;grid-template-columns:minmax(80px,40%) 1fr 48px;align-items:center;gap:8px;padding:3px 6px;border-radius:6px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.hb-row:hover{background:var(--soft)}
.hb-row .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.hb-row .track{height:12px;background:var(--soft);border-radius:3px;overflow:hidden}
.hb-row .fill{display:block;height:100%;background:var(--bar);border-radius:0 3px 3px 0}
.hb-row .n{text-align:right;font-weight:600;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);text-align:left;font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card)}
.scroll th{position:sticky;top:0;z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
td.c{cursor:pointer} td.c:hover{background:var(--soft);outline:1px solid var(--teal)}
td.r,th.r{text-align:right}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.tag.RECOLHEU{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.tag.SOS{background:#ffedd5;border-color:#fdba74;color:#9a3412}
.tag.TROCA{background:#fef9c3;border-color:#fde047;color:#854d0e}
.tag.AVARIA{background:#e0e7ff;border-color:#a5b4fc;color:#3730a3}
.tag.IMPROCEDENTE{background:#f3e8ff;border-color:#d8b4fe;color:#6b21a8}
.tag.GNS,.tag.CRITICA{background:#fee2e2;border-color:#fca5a5;color:#991b1b}
.tag.FAIXA_AMARELA,.tag.ALTA{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.link{color:var(--teal);font-weight:600;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.scroll{max-height:430px;overflow:auto}
.tblwrap{overflow-x:auto}
svg text{fill:var(--ink2);font-size:11px;font-family:inherit}
.bar-rect{fill:var(--bar);cursor:pointer}
.bar-rect.dim{fill:var(--bar2)}
.bar-rect:hover{opacity:.8}
.axis{stroke:var(--line)}
.meta-line{stroke:var(--warn);stroke-dasharray:5 4;stroke-width:1.5}
.ln{fill:none;stroke:var(--line2);stroke-width:2}
.dot{fill:var(--line2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.heat td.c{text-align:center;font-variant-numeric:tabular-nums}
.hm{display:grid;grid-template-columns:38px repeat(24,1fr);gap:2px;font-size:10.5px}
.hm .c{aspect-ratio:1/1;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;min-height:14px}
.hm .c:hover{outline:2px solid var(--ink)}
.hm .lb{color:var(--ink2);display:flex;align-items:center}
.hm .hh{color:var(--muted);text-align:center}
.sec-card{padding:13px 15px;cursor:pointer;text-align:left;border:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.sec-card:hover{border-color:var(--teal)}
.sec-card .sn{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sec-card .st{font-weight:600}
.sec-card .sv{font-size:20px;font-weight:700;color:var(--teal-d)}
.sec-card .sd{font-size:12px;color:var(--ink2)}
.opp{border-left:5px solid var(--bad)}
.opp .big{font-size:44px;font-weight:800;color:var(--bad);line-height:1}
.acao{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.overlay{position:fixed;inset:0;background:rgba(4,20,18,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(960px,100%);background:var(--bg);z-index:60;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer.on{transform:none}
.dhead{background:var(--head);color:var(--head-ink);padding:13px 18px;display:flex;gap:10px;align-items:flex-start}
.dhead h3{margin:0;font-size:18px}
.dhead .dsub{font-size:12.5px;opacity:.8;margin-top:2px}
.dhead .sp{flex:1}
.ibtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:var(--head-ink);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.ibtn:hover{background:rgba(255,255,255,.2)}
.dbody{overflow:auto;padding:14px 18px 40px;flex:1}
.dk{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.dk .card{padding:9px 12px}
.dk .lb{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2)}
.dk .vl{font-size:20px;font-weight:700}
.detail td{background:var(--soft);font-size:12.5px}
.detail .dl{display:grid;grid-template-columns:140px 1fr;gap:3px 12px}
.detail .dl b{color:var(--ink2);font-weight:600}
.scope{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.empty{color:var(--muted);padding:16px 0;text-align:center}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--head);color:var(--head-ink);font-size:12px;padding:6px 9px;border-radius:6px;opacity:0;transition:opacity .1s;max-width:280px}
.more{margin-top:8px}
.foot{margin-top:30px;font-size:12px;color:var(--muted)}
@media (max-width:1180px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;z-index:30;height:auto;display:flex;overflow-x:auto;padding:6px 8px;gap:2px}
  nav.side .brand{display:none}
  nav.side button{width:auto;white-space:nowrap;flex:none}
  .filters{position:static}
}
@media (max-width:760px){
  header.top,.filters{padding-left:16px;padding-right:16px}
  main{padding:14px 16px 60px}
  .g2,.g3,.g21,.g12{grid-template-columns:1fr}.g4,.g5{grid-template-columns:1fr 1fr}
  input[type=search]{width:100%}
  .hide-m{display:none}
  .detail .dl{grid-template-columns:1fr}
  .hm{grid-template-columns:28px repeat(24,minmax(0,1fr));gap:1px}
  .hm .c{min-height:0;font-size:0}
}
@media print{nav.side,.filters,.overlay,.drawer{display:none}.app{display:block}}
</style>
</head>
<body>
<div class="app">
<nav class="side" id="nav"><div class="brand"><div class="t1">Grupo CSC · Quatai</div><div class="t2">Flash Manutenção</div></div></nav>
<div class="content">
<header class="top">
  <div class="t1">Grupo CSC · Quatai · Manutenção · Flash Report interativo</div>
  <h1 id="hTitle">Flash Report Manutenção</h1>
  <div class="sub" id="subhead"></div>
</header>
<div class="filters">
  <div class="fgroup"><span class="flabel">Mês</span><select id="fMes"></select></div>
  <div class="fgroup" id="fCl"><span class="flabel">Cluster</span></div>
  <label class="toggle" title="Desmarque para incluir 'Seguiu viagem' e registros sem tipo"><input type="checkbox" id="fVal" checked> Só intervenções válidas (MKBF)</label>
  <div class="fgroup" style="margin-left:auto"><input type="search" id="fBusca" placeholder="Abrir carro… ex.: 222209" list="dlCarros"><datalist id="dlCarros"></datalist></div>
</div>
<main id="view"></main>
</div>
</div>

<div class="overlay" id="ov"></div>
<aside class="drawer" id="dr" aria-hidden="true">
  <div class="dhead"><button class="ibtn" id="dBack" title="Voltar">←</button><div><h3 id="dTitle"></h3><div class="dsub" id="dSub"></div></div><div class="sp"></div><button class="ibtn" id="dCsv">CSV</button><button class="ibtn" id="dClose">Fechar ✕</button></div>
  <div class="dbody" id="dBody"></div>
</aside>
<div class="tip" id="tip"></div>

<script>
const D = /*__DADOS__*/null;
/* ======================= utilidades ======================= */
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESES_L=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const CLS=["C6","C8","C9","C10","C11"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fInt=v=>Math.round(v||0).toLocaleString("pt-BR");
const f1=v=>(v||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
const f2=v=>(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const f3=v=>(v||0).toLocaleString("pt-BR",{minimumFractionDigits:3,maximumFractionDigits:3});
const fR=v=>"R$ "+fInt(v);
const pct=(a,b)=>b?a/b*100:0;
const fData=d=>d?d.slice(8,10)+"/"+d.slice(5,7)+"/"+d.slice(2,4):"";
const fDH=d=>d?fData(d.slice(0,10))+(d.length>10?" "+d.slice(11,16):""):"";
const mesLb=m=>MESES[+m.slice(5,7)-1]+"/"+m.slice(2,4);
const mesLong=m=>MESES_L[+m.slice(5,7)-1]+"/"+m.slice(0,4);
const addM=(m,k)=>{let y=+m.slice(0,4),mm=+m.slice(5,7)-1+k;y+=Math.floor(mm/12);mm=((mm%12)+12)%12;return y+"-"+String(mm+1).padStart(2,"0")};
const diasNoMes=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const diffD=(a,b)=>Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);
const cnt=(arr,key)=>{const m=new Map();arr.forEach(x=>{const k=typeof key==="function"?key(x):x[key];if(k===undefined||k===null||k==="")return;m.set(k,(m.get(k)||0)+1)});return [...m].sort((a,b)=>b[1]-a[1])};
const sum=(arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function clusterDe(v){v=String(v||"").toUpperCase().trim();if(v.startsWith("2216"))return"C8";if(v.startsWith("2222"))return"C9";if(v.startsWith("2224"))return"C10";if(v.startsWith("2425"))return"C11";if(v.startsWith("W"))return"C6";return"OUTROS"}
const HOJE=D.fim;

/* ======================= dados ======================= */
const I=D.interv;I.forEach(x=>{x.m=x.d.slice(0,7);x.dow=new Date(x.d+"T12:00:00").getDay();x.hr=x.h?+x.h.slice(0,2):null});
const KMD=new Map();D.km_dia_cl.forEach(([d,cl,km,lt])=>{if(!KMD.has(d))KMD.set(d,{});KMD.get(d)[cl]=[km,lt||0]});
const KMV=new Map();D.km_mes_v.forEach(([m,v,km,dias])=>KMV.set(m+"|"+v,{km,dias}));
const ULT_KM=[...KMD.keys()].sort().pop()||"";
const PLANOS=D.planos.map(([v,p,venc,porKm,kmp,dv])=>({v,p,venc,porKm,kmp,dv,cl:clusterDe(v)}));
const REG=D.regen.map(([v,mo,dt,dur,rpm,lt,cus])=>({v,mo,dt,d:dt.slice(0,10),m:dt.slice(0,7),dur,rpm,lt,cus,cl:clusterDe(v)}));
const TROCAS=D.borr.trocas.map(([dt,tipo,v,pos,fr,fc,obs,por,cons])=>({dt,d:dt.slice(0,10),m:dt.slice(0,7),tipo,v,pos,fr,fc,obs,por,cons,cl:clusterDe(v)}));
const PNEUS=D.borr.pneus.map(([fogo,vida,loc,km,marca,medida,pos,dot])=>({fogo,vida,loc,km,marca,medida,pos,dot}));
const CTRL=D.borr.ctrl.map(([v,pos,fb,fa,st,em,por])=>({v,pos,fb,fa,st,em,por,cl:clusterDe(v)}));
const SR=D.sr.map(([id,d,sit,gr,fech,v,obs,func,fim])=>({id,d,m:d.slice(0,7),sit,gr,fech,v,obs,func,fim,cl:clusterDe(v)}));
const GREG=D.gns.regs.map(([v,cat,setor,desc,obs,ent,prev])=>({v,cat,setor,desc,obs,ent,prev,cl:clusterDe(v)}));
const GDIAS=D.gns.dias.map(o=>({d:o.d,m:o.d.slice(0,7),u:o.u,c:o.c.map(i=>GREG[i])}));
const EMB=D.emb_sr.map(([v,tipo,prob,desc,local,prio,st,solic,exec,cri,fech,obs])=>({v,tipo,prob,desc,local,prio,st,solic,exec,cri,d:cri.slice(0,10),m:cri.slice(0,7),fech,obs,cl:clusterDe(v)}));

const PREVMAP=new Map();PREV.forEach(p=>{if(!PREVMAP.has(p.v))PREVMAP.set(p.v,[]);PREVMAP.get(p.v).push(p)});PREVMAP.forEach(a=>a.sort((x,y)=>x.d.localeCompare(y.d)));

function kmPeriodo(ms){let km=0,lt=0;const dias=new Set();for(const [d,o] of KMD){if(!ms.includes(d.slice(0,7)))continue;let s=0,l=0;for(const cl in o)if(inCl(cl)){s+=o[cl][0];l+=o[cl][1]}if(s>0){km+=s;lt+=l;dias.add(d)}}return{km,lt,dias}}
function mkbf(ms,clForce){const sv=S.cl;if(clForce)S.cl=clForce;const {km,lt,dias}=kmPeriodo(ms);const rows=I.filter(x=>ms.includes(x.m)&&inCl(x.cl)&&x.ok&&dias.has(x.d));S.cl=sv;return{km,lt,n:rows.length,mkbf:rows.length?km/rows.length:0,dias,rows}}

function hbars(el,rows,onClick,max=12,fmt=fInt){
  if(typeof el==="string")el=$(el);if(!el)return;
  const top=rows.slice(0,max);if(!top.length){el.innerHTML='<div class="empty">Sem dados</div>';return}

function vbars(el,items,{h=200,onClick,meta,fmt=fInt,line,lineFmt=fInt,lineMeta}={}){
  if(typeof el==="string")el=$(el);if(!el)return;
  if(!items.length){el.innerHTML='<div class="empty">Sem dados</div>';return}
  const W=Math.max(el.clientWidth||560,260),pl=46,pr=line?46:8,pt=14,pb=26,cw=W-pl-pr,ch=h-pt-pb;
  const mx=Math.max(...items.map(i=>i.v),meta||0,1)*1.12;
  const bw=cw/items.length,gap=Math.min(bw*.25,8);
  const y=v=>pt+ch-(v/mx)*ch;
  let s=`<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" role="img">`;
  for(let t=0;t<=4;t++){const v=mx/4*t;s+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke-opacity="${t?0.5:1}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  const every=Math.ceil(items.length/(cw/36));
  items.forEach((it,i)=>{const x=pl+i*bw+gap/2,bh=Math.max(ch-(y(it.v)-pt),it.v>0?1.5:0);
    s+=`<rect class="bar-rect${it.dim?" dim":""}" data-i="${i}" x="${x}" y="${pt+ch-bh}" width="${Math.max(bw-gap,1)}" height="${bh}" rx="2" data-tip="${esc(it.tip||"")}"/>`;
    if(i%every===0)s+=`<text x="${x+(bw-gap)/2}" y="${h-8}" text-anchor="middle">${esc(it.label)}</text>`});
  if(meta)s+=`<line class="meta-line" x1="${pl}" x2="${W-pr}" y1="${y(meta)}" y2="${y(meta)}"/><text x="${W-pr-2}" y="${y(meta)-4}" text-anchor="end" style="fill:var(--warn)">meta ${fmt(meta)}</text>`;
  if(line){const vals=line.filter(v=>v!=null);const lmx=Math.max(...vals,lineMeta||0,1)*1.12;const ly=v=>pt+ch-(v/lmx)*ch;
    for(let t=0;t<=4;t++){const v=lmx/4*t;s+=`<text x="${W-pr+6}" y="${ly(v)+4}" style="fill:var(--line2)">${lineFmt(v)}</text>`}
    let pts=[];line.forEach((v,i)=>{if(v==null){if(pts.length>1)s+=`<polyline class="ln" points="${pts.join(" ")}"/>`;pts=[];return}const x=pl+i*bw+bw/2;pts.push(x+","+ly(v));s+=`<circle class="dot" cx="${x}" cy="${ly(v)}" r="2.6"/>`});
    if(pts.length>1)s+=`<polyline class="ln" points="${pts.join(" ")}"/>`;
    if(lineMeta)s+=`<line class="meta-line" x1="${pl}" x2="${W-pr}" y1="${ly(lineMeta)}" y2="${ly(lineMeta)}"/>`}
  el.innerHTML=s+"</svg>";bindTips(el);
  if(onClick)el.querySelectorAll(".bar-rect").forEach(r=>r.onclick=()=>{hideTip();onClick(items[+r.dataset.i])});
}

function abrirCarro(car){
  car=String(car).trim();
  const v={title:"Carro "+car,escopo:"J",aba:"I",sub:()=>`${clusterDe(car)} · prontuário completo`,render(el){
    const meses=v.escopo==="J"?MESES_JAN:mesesSel();
    const intv=ordI(I.filter(x=>x.v===car&&meses.includes(x.m)&&(!S.val||x.ok)));
    const km=kmCarro(car,meses),val=intv.filter(x=>x.ok).length;
    const pv=PLANOS.filter(p=>p.v===car&&p.venc),pr=(PREVMAP.get(car)||[]).filter(p=>meses.includes(p.m)).slice().reverse();
    const rg=REG.filter(r=>r.v===car&&meses.includes(r.m)).sort((a,b)=>b.dt.localeCompare(a.dt));
    const sr=SR.filter(r=>r.v===car&&(r.sit==="N"||meses.includes(r.m))).sort((a,b)=>b.d.localeCompare(a.d));
    const gd=GDIAS.filter(g=>meses.includes(g.m)).map(g=>({d:g.d,r:g.c.find(c=>c.v===car)})).filter(o=>o.r);
    const tr=TROCAS.filter(t=>t.v===car&&meses.includes(t.m)).sort((a,b)=>b.dt.localeCompare(a.dt));
    const em=EMB.filter(e=>e.v===car).sort((a,b)=>b.cri.localeCompare(a.cri));
    const ct=CTRL.filter(c=>c.v===car&&c.st.toUpperCase()!=="OK");
    const porMes=MESES_JAN.map(m=>{const n=I.filter(x=>x.v===car&&x.m===m&&(!S.val||x.ok)).length;const k=(KMV.get(m+"|"+car)||{}).km||0;return{k:m,label:mesLb(m),v:n,dim:v.escopo==="P"&&!meses.includes(m),tip:`${mesLong(m)}: ${n} intervenções · ${fInt(k)} km${n&&k?" · MKBF "+fInt(k/n):""}`}});
    const of=PCM.filter(x=>x.v===car&&(meses.includes(x.m)||!x.sai)).sort((a,b)=>(b.ent||b.d).localeCompare(a.ent||a.d));
    const abas=[["I","Intervenções",intv.length],["O","Oficina",of.length],["P","Preventivas",pv.length+pr.length],["R","Regeneração",rg.length],["S","SR",sr.length],["G","GNS / PCM",gd.length],["T","Pneus",tr.length+ct.length],["E","Embarcados",em.length]];
    el.innerHTML=`<div class="scope"><span class="flabel">Escopo</span><button class="chip ${v.escopo==="P"?"on":""}" data-esc="P">${esc(periodoTxt())}</button><button class="chip ${v.escopo==="J"?"on":""}" data-esc="J">Janela toda</button></div>`+
      dk([["Intervenções",fInt(intv.length)],["KM rodado",fInt(km)],["MKBF do carro",val&&km?fInt(km/val):"—"],["Prev. vencidas",pv.length,pv.length?"down":""],["Regenerações",rg.length],["SR abertas",sr.filter(s=>s.sit==="N").length,sr.some(s=>s.sit==="N")?"warn":""],["Dias no PCM",gd.length]])+
      `<div class="grid g2" style="margin-bottom:12px">${card("Intervenções por mês",'<div id="dM"></div>',"janela toda · clique no mês")}${card("Defeitos do carro",'<div id="dD"></div>')}</div>`+
      `<div class="tabs">${abas.map(([k,t,n])=>`<button class="chip ${v.aba===k?"on":""}" data-aba="${k}">${t} (${n})</button>`).join("")}</div><div id="dAba"></div>`;
    el.querySelectorAll("[data-esc]").forEach(b=>b.onclick=()=>{v.escopo=b.dataset.esc;renderDrawer()});

const CSV_I=[["numero_sos","n"],["data","d"],["hora","h"],["carro","v"],["cluster","cl"],["linha","l"],["tipo","t"],["valida_mkbf","ok"],["status","st"],["setor","se"],["grupo","gr"],["defeito","p"],["reclamacao","rc"],["solucao","so"],["controlabilidade","ct"],["motorista","mo"],["embarcado","em"]];
function baixarCsv(rows,cols,nome){
  const q=v=>`"${String(v??"").replace(/"/g,'""').replace(/<[^>]+>/g,"")}"`;
  const val=(r,k)=>typeof k==="function"?k(r):r[k];
  const csv="﻿"+cols.map(c=>c[0]).join(";")+"\n"+rows.map(r=>cols.map(c=>q(val(r,c[1]))).join(";")).join("\n");
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=String(nome).replace(/[^\w\-]+/g,"_")+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){alert("Este visualizador bloqueia downloads. Abra o arquivo no Chrome/Edge para exportar o CSV.")}
}

/* ---------- Reincidência ≤30 dias (regras do SOS_Resumo) ---------- */
function reinc30(rows){
  const pv=new Map();rows.slice().sort((a,b)=>(a.d+a.h).localeCompare(b.d+b.h)).forEach(x=>{if(!pv.has(x.v))pv.set(x.v,[]);pv.get(x.v).push(x)});
  const ev=[],det=[];let soma=0,qtd=0;
  for(const [v,a] of pv){let rv=0,rt=0,rs=0,sv=0,qv=0;
    for(let i=1;i<a.length;i++){const dd=diffD(a[i].d,a[i-1].d);sv+=dd;qv++;soma+=dd;qtd++;
      if(dd<=30){rv++;const tec=a[i].p===a[i-1].p&&a[i].p!=="N/D",set=a[i].se===a[i-1].se&&a[i].se!=="N/D";if(tec)rt++;if(set)rs++;ev.push({...a[i],gap:dd,anterior:a[i-1],tec,set})}}
    det.push({v,cl:clusterDe(v),n:a.length,rv,rt,rs,im:qv?sv/qv:0,dt:cnt(a,"p")[0]?.[0]||"N/D",st:cnt(a,"se")[0]?.[0]||"N/D"})}
  det.sort((a,b)=>b.rv-a.rv||b.n-a.n);
  const vr=det.filter(x=>x.rv>0).length;
  return{ev,det,vc:det.length,vr,taxa:pct(vr,det.length),rv:ev.length,rt:ev.filter(e=>e.tec).length,rs:ev.filter(e=>e.set).length,im:qtd?soma/qtd:0};
}

/* ---------- Revisão × quebra · avaliação de técnicos (regras do SOS_Resumo) ---------- */
const FAIXAS=[["0-7 dias",0,7],["8-15 dias",8,15],["16-30 dias",16,30],["31-60 dias",31,60],["60+ dias",61,1e9]];
const faixa=v=>v==null?"Sem informação":(FAIXAS.find(([,a,b])=>v>=a&&v<=b)||["60+ dias"])[0];
const ROLE_LB={mecanico:"Mecânico",eletricista:"Eletricista",funilaria:"Funilaria",borracharia:"Borracharia"};
function tecnicos(ms,rows){
  const map=new Map();const get=n=>{if(!map.has(n))map.set(n,{nome:n,fn:"",rev:0,sos:0,prec:0,ds:0,dq:0,ks:0,kq:0,defs:{},lista:[]});return map.get(n)};
  PFUNC.filter(p=>ms.includes(p.m)).forEach(p=>["mecanico","eletricista","funilaria","borracharia"].forEach(r=>{if(p[r]){const o=get(p[r]);o.rev++;if(!o.fn)o.fn=r}}));
  rows.forEach(x=>{if(!x.rr)return;const o=get(x.rr);if(!o.fn)o.fn=x.fn;const insp=x.rt==="I";const MK=insp?6000:12000,MD=insp?25:45;
    const kmOk=x.rk!=null&&x.rk<=MK,dOk=x.rd!=null&&x.rd<=MD;if(!(kmOk||dOk))return;
    o.sos++;o.lista.push(x);if(dOk){o.ds+=x.rd;o.dq++}if(kmOk){o.ks+=x.rk;o.kq++}
    if((x.rd!=null&&x.rd<=15)||(kmOk&&x.rk<=3000))o.prec++;o.defs[x.p]=(o.defs[x.p]||0)+1});
  return[...map.values()].filter(o=>o.rev||o.sos).map(o=>({...o,ef:o.rev?Math.max(0,o.rev-o.sos)/o.rev*100:null,tr:o.sos?o.prec/o.sos*100:0,md:o.dq?o.ds/o.dq:null,mk:o.kq?o.ks/o.kq:null,dt:Object.entries(o.defs).sort((a,b)=>b[1]-a[1])[0]?.[0]||"—"})).sort((a,b)=>b.prec-a.prec||b.sos-a.sos);
}
function secRev(){
  const ms=mesesSel(),rows=baseI(ms);
  const dp=rows.filter(x=>x.dp>0),di=rows.filter(x=>x.di>0);
  const ult=rows.filter(x=>x.rd!=null),ate15=ult.filter(x=>x.rd<=15);
  const porDef=cnt(rows,"p").slice(0,15).map(([p,n])=>{const a=rows.filter(x=>x.p===p);const ap=a.filter(x=>x.dp>0),ai=a.filter(x=>x.di>0);return{p,n,mp:ap.length?sum(ap,x=>x.dp)/ap.length:null,mi:ai.length?sum(ai,x=>x.di)/ai.length:null}});
  const tec=tecnicos(ms,rows);
  const COL_RV=[{t:"Data",k:x=>fData(x.d)},{t:"Carro",k:"v",car:1},{t:"Defeito",k:"p"},{t:"Dias pós-prev.",k:x=>x.dp??"—",r:1},{t:"Dias pós-insp.",k:x=>x.di??"—",r:1},{t:"Última revisão",k:x=>x.rt==="I"?"Inspeção":"Preventiva"},{t:"Responsável",k:x=>x.rr||"—",hm:1},{t:"KM desde",k:x=>x.rk!=null?fInt(x.rk):"—",r:1,hm:1}];
  const L=(t,rs)=>abrirTabela(t,periodoTxt(),rs.slice().sort((a,b)=>b.d.localeCompare(a.d)),COL_RV,{det:DET_I});
  V().innerHTML=head("Revisão × quebra · avaliação de técnicos","Quanto tempo depois da preventiva (10 mil) e da inspeção (5 mil) o carro quebra · quem fez a última revisão")+
  `<div class="grid g4">${kpi("Dias após preventiva",dp.length?f1(sum(dp,x=>x.dp)/dp.length):"—",`média · ${dp.length} quebras com preventiva vinculada`,{id:"rv1"})}${kpi("Dias após inspeção",di.length?f1(sum(di,x=>x.di)/di.length):"—",`média · ${di.length} quebras com inspeção vinculada`,{id:"rv2"})}${kpi("Quebra até 15 dias da revisão",f1(pct(ate15.length,ult.length))+"%",`${ate15.length} de ${ult.length} quebras`,{id:"rv3",cls:"down"})}${kpi("Técnicos avaliados",fInt(tec.length),`${fInt(sum(tec,t=>t.prec))} retrabalhos precoces`,{id:"rv4"})}</div>
  <div class="grid g2 mt">${card("Faixa de dias após a preventiva",'<div id="fp"></div>',"clique numa faixa")}${card("Faixa de dias após a inspeção",'<div id="fi"></div>',"clique numa faixa")}</div>
  <div class="mt">${card("Defeitos × tempo desde a revisão",'<div class="tblwrap" id="tdf"></div>',"clique no defeito")}</div>
  <div class="mt">${card("Avaliação de técnicos — SOS atribuídos × retrabalho precoce",`<div class="tblwrap scroll" id="ttc"></div><div class="hint">Responsável = quem fez a última revisão (preventiva ou inspeção, a mais recente) na função do setor da quebra. Conta só quebras dentro do ciclo (inspeção ≤ 25 dias ou ≤ 6 mil km; preventiva ≤ 45 dias ou ≤ 12 mil km). Retrabalho precoce = quebra ≤ 15 dias ou ≤ 3 mil km. Eficácia = (revisões no período − SOS atribuídos) ÷ revisões.</div>`,"clique no técnico")}</div>`+
  cons("Revisão × quebra",`Em ${periodoTxt()}, as quebras aconteceram em média ${dp.length?f1(sum(dp,x=>x.dp)/dp.length):"—"} dias após a preventiva e ${di.length?f1(sum(di,x=>x.di)/di.length):"—"} dias após a inspeção. <b>${f1(pct(ate15.length,ult.length))}%</b> ocorreram em até 15 dias da última revisão. ${tec[0]&&tec[0].prec?`O maior número de retrabalhos precoces está com <b>${esc(tec[0].nome)}</b> (${tec[0].prec} de ${tec[0].sos} SOS atribuídos).`:""}`);
  const fx=(k,campo)=>{const o=FAIXAS.map(f=>f[0]).concat("Sem informação").map(f=>[f,rows.filter(x=>faixa(x[campo])===f).length]).filter(r=>r[1]);return o};
  hbars("#fp",fx("fp","dp"),k=>L("Após preventiva · "+k,rows.filter(x=>faixa(x.dp)===k)),6);
  hbars("#fi",fx("fi","di"),k=>L("Após inspeção · "+k,rows.filter(x=>faixa(x.di)===k)),6);
  const tdf=$("#tdf");tdf.innerHTML=tabela(porDef,[{t:"Defeito",k:"p"},{t:"Quebras",k:"n",r:1},{t:"Média dias pós-preventiva",k:x=>x.mp!=null?f1(x.mp):"—",r:1},{t:"Média dias pós-inspeção",k:x=>x.mi!=null?f1(x.mi):"—",r:1}]);
  tdf.querySelectorAll("tbody tr").forEach((tr,i)=>{tr.classList.add("click");tr.onclick=()=>L("Defeito · "+porDef[i].p,rows.filter(x=>x.p===porDef[i].p))});
  const colsT=[{t:"Técnico",k:"nome"},{t:"Função",k:x=>ROLE_LB[x.fn]||"—",hm:1},{t:"Revisões no período",k:"rev",r:1},{t:"SOS atribuídos",k:"sos",r:1},{t:"Retrabalho precoce",k:x=>x.prec?`<b class="down">${x.prec}</b>`:"0",f:v=>v,r:1},{t:"Eficácia",k:x=>x.ef==null?"—":f1(x.ef)+"%",r:1},{t:"Taxa retrabalho",k:x=>x.sos?f1(x.tr)+"%":"—",r:1},{t:"Dias até quebrar",k:x=>x.md!=null?f1(x.md):"—",r:1,hm:1},{t:"KM até quebrar",k:x=>x.mk!=null?fInt(x.mk):"—",r:1,hm:1},{t:"Defeito top",k:"dt",hm:1}];
  const tt=$("#ttc");const bind=()=>tt.querySelectorAll("tbody tr").forEach((tr,i)=>{tr.classList.add("click");tr.onclick=()=>L("SOS atribuídos · "+tec[i].nome,tec[i].lista)});
  tt.innerHTML=tabela(tec,colsT,{limit:40});bind();tt.querySelectorAll("button[data-more]").forEach(b=>b.onclick=()=>{tt.innerHTML=tabela(tec,colsT,{limit:1e9});bind()});
  on("rv1",()=>L("Quebras com preventiva vinculada",dp));on("rv2",()=>L("Quebras com inspeção vinculada",di));on("rv3",()=>L("Quebras em até 15 dias da revisão",ate15));on("rv4",()=>$("#ttc").scrollIntoView({behavior:"smooth",block:"center"}));
}

function secOficina(){
  const ms=mesesSel(),ent=PCM.filter(x=>ms.includes(x.m)&&inCl(x.cl));

  const res=ent.filter(x=>x.sai),gns=ent.filter(x=>x.cat==="GNS");

  const backG=back.filter(x=>x.cat==="GNS");
  const pf=new Map();ent.slice().sort((a,b)=>(a.ent||a.d).localeCompare(b.ent||b.d)).forEach(x=>{if(!pf.has(x.v))pf.set(x.v,[]);pf.get(x.v).push(x)});

    if(r)reent.push({v,n:a.length,r,dias:sum(a,x=>diffD((x.sai||HOJE).slice(0,10),x.d)),ult:a.at(-1).d,mot:a.map(x=>x.desc).filter(Boolean).slice(-3).join(" | "),a})}
  reent.sort((a,b)=>b.r-a.r||b.dias-a.dias);
  const hist=MESES_JAN.map(m=>{const g=PCM.filter(x=>x.m===m&&x.cat==="GNS"&&inCl(x.cl)).length,dd=PCMD.dias.filter(d=>d.startsWith(m)).length;return{k:m,label:mesLb(m),v:dd?g/dd:0,dim:!ms.includes(m),tip:`${mesLong(m)}: ${g} entradas GNS em ${dd} dias de PCM`}});
  const COL_O=[{t:"Entrada",k:x=>fDH(x.ent)||fData(x.d)},{t:"Carro",k:"v",car:1},{t:"Categoria",k:"cat",f:tagT},{t:"Setor",k:"setor",hm:1},{t:"Defeito / descrição",k:x=>(x.desc||"").slice(0,70)},{t:"Motivo",k:x=>(x.obs||"").slice(0,40),hm:1},{t:"Saída",k:x=>x.sai?fDH(x.sai):"em aberto"},{t:"Turno",k:"turno",hm:1}];
  const DET_O=r=>dl([["Defeito / descrição",r.desc],["Motivo (observação)",r.obs],["Setor",r.setor],["OS",r.os],["Entrada",fDH(r.ent)||fData(r.d)],["Saída",r.sai?fDH(r.sai):"em aberto"],["Turno",r.turno],["Sessão",fData(r.dref)]]);
  const L=(t,rs,sub)=>abrirTabela(t,sub||periodoTxt(),rs.slice().sort((a,b)=>(b.ent||b.d).localeCompare(a.ent||a.d)),COL_O,{det:DET_O});
  V().innerHTML=head("Oficina · entradas no PCM","Cada entrada física do carro na oficina (a virada diária do PCM não duplica) · backlog = carros ainda sem saída")+
  `<div class="grid g5">${kpi("Entradas",fInt(ent.length),`${diasPcm} dias com PCM`,{id:"of1"})}${kpi("Taxa de resolução",f1(pct(res.length,ent.length))+"%",`${fInt(res.length)} já liberadas`,{id:"of2"})}${kpi("Entradas GNS",fInt(gns.length),`${f1(pct(gns.length,ent.length))}% · ${f2(diasPcm?gns.length/diasPcm:0)}/dia de PCM`,{id:"of3"})}${kpi("Reentradas",fInt(reent.length),"carros liberados que voltaram",{id:"of4",cls:reent.length?"down":""})}${kpi("Backlog hoje",fInt(back.length),`${backG.length} em GNS`,{id:"of5",cls:"warn"})}</div>
  <div class="grid g3 mt">${card("Aging dos GNS em aberto (dias)",'<div id="ag"></div>',"hoje · clique numa faixa")}${card("Backlog por motivo",'<div id="bm"></div>',"observação do PCM · hoje")}${card("Entradas por turno",'<div id="tu"></div>')}</div>
  <div class="grid g3 mt">${card("Defeitos que mais entram na oficina",'<div id="od"></div>')}${card("Por setor",'<div id="os"></div>')}${card("Por categoria",'<div id="oc"></div>')}</div>
  <div class="grid g2 mt">${card("Entradas GNS por dia de PCM — mês a mês",'<div id="chO"></div>',"clique num mês")}${card("Carros que voltaram à oficina",'<div class="tblwrap scroll" id="ore"></div>',"clique no carro")}</div>
  <div class="note mt">Diferença para a seção GNS: lá o indicador é a <b>média de carros parados em GNS por dia útil</b> (foto de cada sessão); aqui é o <b>fluxo de entradas</b> na oficina.</div>`+
  cons("Oficina",`Em ${periodoTxt()}, foram <b>${fInt(ent.length)}</b> entradas na oficina, com ${f1(pct(res.length,ent.length))}% já liberadas; ${fInt(gns.length)} entraram em GNS. <b>${reent.length}</b> carros voltaram depois de liberados. Hoje há ${back.length} carros sem saída, ${backG.length} em GNS${backG.length?` (o mais antigo com ${Math.max(...backG.map(x=>x.dias))} dias)`:""}.`);
  vbars("#ag",AGING.map(([k,a,b])=>{const n=backG.filter(x=>x.dias>=a&&x.dias<=b).length;return{k,label:k,v:n,tip:`${k} dias: ${n} carros`}}),{h:170,onClick:it=>{const [,a,b]=AGING.find(x=>x[0]===it.k);L("GNS em aberto há "+it.k+" dias",backG.filter(x=>x.dias>=a&&x.dias<=b),"hoje")}});

  $("#subhead").textContent=`${periodoTxt()} · ${S.cl==="TODOS"?"todos os clusters":"cluster "+S.cl} · dados ao vivo do Supabase, gerado em ${D.gerado_em}`;
  try{RENDER[S.sec]()}catch(e){console.error(e);V().innerHTML=`<div class="note">Erro ao montar esta seção: ${esc(e.message)}</div>`}
  V().insertAdjacentHTML("beforeend",`<div class="foot">Janela de dados: ${fData(D.ini)} a ${fData(D.fim)} · MKBF = KM TransNet ÷ intervenções válidas (exclui "seguiu viagem"), só dias com KM consolidado · meta ${fInt(D.meta_mkbf)}.</div>`);
}
function syncFiltros(){$("#fMes").value=S.mes;document.querySelectorAll("#fCl .chip").forEach(c=>c.classList.toggle("on",c.dataset.cl===S.cl));$("#fVal").checked=S.val}
$("#fMes").innerHTML=MESES_JAN.slice().reverse().map(m=>`<option value="${m}">${mesLong(m)}${m===HOJE.slice(0,7)?" (parcial)":""}</option>`).join("")+`<option value="JANELA">Janela toda (${MESES_JAN.length} meses)</option>`;
$("#fCl").insertAdjacentHTML("beforeend",["TODOS",...CLS].map(c=>`<button class="chip" data-cl="${c}">${c==="TODOS"?"Todos":c}</button>`).join(""));
$("#fCl").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{S.cl=c.dataset.cl;syncFiltros();renderSec()});
$("#fMes").onchange=e=>{S.mes=e.target.value;renderSec()};
$("#fVal").onchange=e=>{S.val=e.target.checked;renderSec()};
$("#dlCarros").innerHTML=[...new Set(I.map(x=>x.v).concat(PLANOS.map(p=>p.v)))].sort().map(v=>`<option value="${esc(v)}">`).join("");
const abrirBusca=e=>{const v=e.target.value.trim();if(v){abrirCarro(v);e.target.value=""}};
$("#fBusca").addEventListener("change",abrirBusca);$("#fBusca").addEventListener("keydown",e=>{if(e.key==="Enter")abrirBusca(e)});
addEventListener("hashchange",()=>{let s="";try{s=location.hash.slice(1)}catch(e){}if(s!==S.sec&&RENDER[s]){S.sec=s;renderSec()}});
let rz,lw=innerWidth;addEventListener("resize",()=>{if(Math.abs(innerWidth-lw)<40)return;lw=innerWidth;clearTimeout(rz);rz=setTimeout(renderSec,200)});
syncFiltros();renderSec();
</script>
</body>
</html>
